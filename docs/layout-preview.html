<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小风音乐 · 新布局（完整功能版）</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", system-ui, sans-serif;
    color: #ffffff;
    background: #0b0b16;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ===== 背景层（幻灯片 + 氛围渐变）===== */
  .bg {
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(1100px 700px at 78% 20%, rgba(72, 62, 130, 0.55), transparent 60%),
      radial-gradient(900px 620px at 15% 85%, rgba(42, 80, 120, 0.45), transparent 60%),
      linear-gradient(160deg, #12121f 0%, #0b0b16 55%, #07070d 100%);
    transition: background 0.8s;
  }
  .bg::after {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(600px 300px at 20% 8%, rgba(255,255,255,0.06), transparent 70%);
  }
  .bg.has-cover {
    background:
      radial-gradient(1100px 700px at 78% 20%, rgba(90, 90, 150, 0.5), transparent 60%),
      radial-gradient(900px 620px at 15% 85%, rgba(60, 80, 130, 0.4), transparent 60%),
      linear-gradient(160deg, #14141f 0%, #0d0d16 55%, #08080d 100%);
  }
  /* 幻灯片图片层 */
  .bg .slide-img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; opacity: 0;
    transition: opacity 1.2s ease;
    pointer-events: none;
  }
  .bg .slide-img.on { opacity: 0.28; }
  /* 幻灯片遮罩（保证白字可读） */
  .bg::before {
    content: ""; position: absolute; inset: 0; z-index: 1;
    background: linear-gradient(180deg, rgba(5,5,10,0.35) 0%, rgba(5,5,10,0.15) 40%, rgba(5,5,10,0.45) 100%);
    pointer-events: none;
  }

  /* ===== 顶部居中：在线播放（搜索）入口 ===== */
  .online-search {
    position: fixed;
    top: 7vh; left: 50%; transform: translateX(-50%);
    z-index: 20;
    display: flex; align-items: center; gap: 12px;
    width: 420px; max-width: 60vw;
    padding: 12px 20px;
    border-radius: 999px;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.22);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 8px 28px rgba(0,0,0,0.3);
    transition: border-color 0.2s, background 0.2s;
  }
  .online-search:focus-within { border-color: rgba(255,255,255,0.55); background: rgba(255,255,255,0.1); }
  .online-search .search-icon { flex-shrink: 0; color: rgba(255,255,255,0.85); display: flex; }
  .online-search select {
    flex-shrink: 0;
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
    border-radius: 8px; color: #fff; font-size: 13px; font-family: inherit;
    padding: 5px 6px; outline: none; cursor: pointer;
  }
  .online-search select option { background: #1a1a2e; color: #fff; }
  .online-search input {
    flex: 1; min-width: 0;
    background: none; border: none; outline: none;
    color: #fff; font-size: 15px; font-family: inherit; letter-spacing: 1px;
  }
  .online-search input::placeholder { color: rgba(255,255,255,0.45); }
  .online-search .search-hint {
    flex-shrink: 0; font-size: 12px; letter-spacing: 2px;
    color: rgba(255,255,255,0.5);
    border-left: 1px solid rgba(255,255,255,0.18); padding-left: 12px;
    cursor: pointer;
  }
  .online-search .search-hint:hover { color: #fff; }

  /* ===== 左上角文字区（滚动）===== */
  .header { position: fixed; top: 9vh; left: 6.5vw; z-index: 10; max-width: 34vw; }
  .main-title {
    font-size: 76px; font-weight: 700; letter-spacing: 4px;
    line-height: 1.1; text-align: left;
    text-shadow: 0 2px 24px rgba(0,0,0,0.45);
    max-width: 100%;
    white-space: nowrap; overflow: hidden;
  }
  .sub-title {
    margin-top: 14px;
    font-size: 38px; font-weight: 300; letter-spacing: 8px;
    text-align: center; color: rgba(255,255,255,0.92);
    text-shadow: 0 1px 16px rgba(0,0,0,0.4);
    max-width: 100%;
    white-space: nowrap; overflow: hidden;
  }
  .marquee-inner {
    display: inline-block; white-space: nowrap;
    padding-right: 80px; will-change: transform;
    animation: marquee var(--scroll-dur, 0s) linear infinite;
  }
  .marquee-inner.static { padding-right: 0; animation: none; }
  @keyframes marquee {
    from { transform: translateX(0); }
    to   { transform: translateX(var(--scroll-dist, -100px)); }
  }

  /* ===== 左侧播放控件 ===== */
  .player {
    position: fixed; left: 6.5vw; top: 50%; transform: translateY(-50%);
    z-index: 10; display: flex; flex-direction: column; align-items: center; gap: 24px;
  }
  .cover {
    width: 268px; height: 268px; border-radius: 30px;
    background: linear-gradient(150deg, #3d3a5c 0%, #23233a 55%, #151527 100%);
    box-shadow: 0 24px 60px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.08);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; position: relative;
  }
  #cover-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 0.5s; }
  #cover-img.show { opacity: 1; }
  .cover-note { position: relative; z-index: 2; width: 74px; height: 74px; opacity: 0.85; transition: opacity 0.4s; }
  .cover.has-cover .cover-note { opacity: 0; }

  .controls { width: 268px; display: flex; flex-direction: column; gap: 14px; }

  .progress { width: 100%; height: 14px; display: flex; align-items: center; cursor: pointer; }
  .progress-track { position: relative; width: 100%; height: 2px; border-radius: 1px; background: rgba(255,255,255,0.22); }
  .progress-fill {
    position: absolute; left: 0; top: 0; height: 100%; width: 0%;
    border-radius: 1px; background: #fff; box-shadow: 0 0 8px rgba(255,255,255,0.6);
  }
  .progress-dot {
    position: absolute; top: 50%; left: 0%;
    width: 9px; height: 9px; border-radius: 50%;
    background: #fff; transform: translate(-50%, -50%);
    box-shadow: 0 0 10px rgba(255,255,255,0.9);
  }
  .time-row { display: flex; justify-content: space-between; font-size: 11px; color: rgba(255,255,255,0.5); font-variant-numeric: tabular-nums; margin-top: -6px; }

  .btn-row { display: flex; align-items: center; justify-content: space-between; width: 100%; }
  .icon-btn {
    background: none; border: none; color: rgba(255,255,255,0.92); cursor: pointer;
    padding: 6px; display: flex; align-items: center; justify-content: center;
    transition: transform 0.15s, color 0.15s, opacity 0.15s;
  }
  .icon-btn:hover { color: #fff; transform: scale(1.12); }
  .icon-btn:active { transform: scale(0.94); }
  .icon-btn svg { display: block; }
  .icon-btn.play { transform: scale(1.18); }
  .icon-btn.play:hover { transform: scale(1.3); }
  .icon-btn.play:active { transform: scale(1.1); }
  .icon-btn.secondary { opacity: 0.82; }

  /* ===== 弹出面板（搜索/队列/歌单/设置共用）===== */
  .panel {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    z-index: 40; width: 560px; max-width: 90vw; max-height: 76vh;
    background: rgba(18,18,32,0.94);
    backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(255,255,255,0.12); border-radius: 18px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    display: none; flex-direction: column; overflow: hidden;
    pointer-events: auto;
  }
  .panel.open { display: flex; }
  .panel-header {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 18px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    flex-shrink: 0;
  }
  .panel-title { flex: 1; font-size: 15px; font-weight: 600; letter-spacing: 2px; }
  .panel-sub { font-size: 11px; color: rgba(255,255,255,0.4); }
  .panel-close {
    width: 26px; height: 26px; border: none; border-radius: 50%;
    background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.6);
    cursor: pointer; font-size: 13px;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s;
  }
  .panel-close:hover { background: rgba(255,60,60,0.3); color: #fff; }
  .panel-body { flex: 1; overflow-y: auto; padding: 10px; min-height: 0; }
  .panel-body::-webkit-scrollbar { width: 4px; }
  .panel-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }
  .panel-footer {
    padding: 10px 18px; border-top: 1px solid rgba(255,255,255,0.08);
    display: flex; align-items: center; gap: 10px; flex-shrink: 0;
  }

  /* 搜索结果/歌曲行 */
  .song-row {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; border-radius: 10px; cursor: pointer;
    transition: background 0.13s;
  }
  .song-row:hover { background: rgba(255,255,255,0.08); }
  .song-row.playing { background: rgba(255,255,255,0.13); }
  .song-row .song-thumb {
    width: 38px; height: 38px; border-radius: 8px; flex-shrink: 0;
    background: rgba(255,255,255,0.08); object-fit: cover;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; font-size: 16px;
  }
  .song-row .song-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .song-row .song-info { flex: 1; min-width: 0; }
  .song-row .song-name { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .song-row .song-artist { font-size: 11px; color: rgba(255,255,255,0.45); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .song-row .song-actions { display: flex; gap: 4px; flex-shrink: 0; }
  .song-row .act-btn, .pl-card-actions .act-btn {
    padding: 4px 9px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.7);
    cursor: pointer; font-size: 11px; font-family: inherit;
    transition: background 0.13s, color 0.13s;
  }
  .song-row .act-btn:hover, .pl-card-actions .act-btn:hover { background: rgba(255,255,255,0.18); color: #fff; }
  .song-row .act-btn.play-btn, .pl-card-actions .act-btn.play-btn { border-color: rgba(255,255,255,0.3); color: #fff; }
  .empty-tip { padding: 26px; text-align: center; font-size: 13px; color: rgba(255,255,255,0.35); }

  /* 歌单卡片 */
  .pl-card {
    border: 1px solid rgba(255,255,255,0.08); border-radius: 12px;
    margin-bottom: 8px; overflow: hidden;
  }
  .pl-card-head {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; cursor: pointer;
    transition: background 0.13s;
  }
  .pl-card-head:hover { background: rgba(255,255,255,0.05); }
  .pl-card-name { flex: 1; font-size: 13px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pl-card-count { font-size: 11px; color: rgba(255,255,255,0.4); flex-shrink: 0; }
  .pl-card-body { display: none; padding: 4px 8px 8px; border-top: 1px solid rgba(255,255,255,0.05); max-height: 30vh; overflow-y: auto; }
  .pl-card.open .pl-card-body { display: block; }
  .pl-card-actions { display: flex; gap: 6px; flex-shrink: 0; }

  /* 设置面板 */
  .set-group { margin-bottom: 18px; }
  .set-title { font-size: 12px; letter-spacing: 2px; color: rgba(255,255,255,0.45); margin-bottom: 10px; text-transform: uppercase; }
  .set-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; font-size: 13px; }
  .set-row label { width: 90px; flex-shrink: 0; color: rgba(255,255,255,0.75); }
  .set-row select, .set-row input[type="range"], .set-row input[type="color"] { flex: 1; }
  .set-row input[type="range"] { accent-color: #fff; }
  .set-row select {
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
    border-radius: 8px; color: #fff; padding: 6px 8px; font-family: inherit; outline: none;
  }
  .set-row select option { background: #1a1a2e; }
  .set-row input[type="color"] { width: 40px; height: 28px; border: none; background: none; cursor: pointer; }
  .set-row .set-val { min-width: 44px; text-align: right; color: rgba(255,255,255,0.55); font-size: 12px; }
  .set-check { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; }
  .set-check input { width: 16px; height: 16px; accent-color: #fff; cursor: pointer; }
  .set-info { font-size: 11px; color: rgba(255,255,255,0.35); margin: -4px 0 10px 102px; }
  .set-desc { font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 2px; }
  .set-actions { display: flex; justify-content: flex-end; gap: 10px; padding-top: 6px; }
  .set-btn {
    padding: 9px 26px; border-radius: 999px; border: none;
    background: rgba(255,255,255,0.14); color: #fff;
    font-size: 13px; font-family: inherit; cursor: pointer; letter-spacing: 1px;
    transition: background 0.15s;
  }
  .set-btn:hover { background: rgba(255,255,255,0.25); }
  .set-btn.primary { background: #fff; color: #111; font-weight: 600; }
  .set-btn.primary:hover { background: rgba(255,255,255,0.85); }

  /* 导入弹窗输入 */
  .import-input {
    flex: 1; min-width: 0;
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
    border-radius: 8px; color: #fff; font-size: 13px; font-family: inherit;
    padding: 9px 12px; outline: none;
  }
  .import-input::placeholder { color: rgba(255,255,255,0.35); }

  /* 更多菜单 */
  .more-menu {
    position: fixed;
    left: calc(6.5vw + 268px - 208px);
    top: 50%; transform: translateY(-50%);
    z-index: 30; min-width: 196px;
    background: rgba(18,18,32,0.88);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.12); border-radius: 16px;
    box-shadow: 0 16px 44px rgba(0,0,0,0.55);
    padding: 8px;
    opacity: 0; pointer-events: none;
    transition: opacity 0.18s ease;
  }
  .more-menu.open { opacity: 1; pointer-events: auto; }
  .menu-item {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 14px; font-size: 14px;
    color: rgba(255,255,255,0.92); border-radius: 10px; cursor: pointer;
    transition: background 0.14s, color 0.14s;
  }
  .menu-item:hover { background: rgba(255,255,255,0.12); color: #fff; }
  .menu-item span { letter-spacing: 1px; }
  .menu-divider { height: 1px; margin: 6px 10px; background: rgba(255,255,255,0.1); }

  /* 右侧歌词 */
  .lyrics {
    position: fixed; right: 7vw; top: 50%; transform: translateY(-50%);
    z-index: 10;
    display: flex; flex-direction: column; align-items: center; gap: 16px;
    width: 44vw; text-align: center;
  }
  .lyric-line {
    font-size: var(--lyrics-size, 26px); font-weight: 500; color: rgba(255,255,255,0.35);
    letter-spacing: 2px; text-shadow: 0 1px 12px rgba(0,0,0,0.4);
    width: 100%;
    white-space: normal; word-break: break-word; line-height: 1.5;
    transition: color 0.4s, font-size 0.4s, opacity 0.4s;
  }
  .lyric-line.prev, .lyric-line.next { opacity: 0.65; }
  .lyric-line.current { font-size: var(--lyrics-size-current, 34px); font-weight: 700; text-shadow: 0 2px 20px rgba(0,0,0,0.55); }
  .lyric-line.current .lyric-main {
    background: linear-gradient(
      to right,
      var(--scan-color, #ffffff) var(--scan-p, 0%),
      rgba(255,255,255,0.32) var(--scan-p, 0%)
    );
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: none;
    filter: drop-shadow(0 0 12px rgba(255,255,255,0.55));
    transition: none;
  }
  .lyric-trans {
    display: block; margin-top: 6px;
    font-size: 17px; font-weight: 400; letter-spacing: 1px;
    color: rgba(255,255,255,0.55); line-height: 1.5;
  }
  .lyric-line.current .lyric-trans { color: rgba(255,255,255,0.62); font-size: 19px; }

  /* 底部励志句 */
  .motivation {
    position: fixed; left: 50%; bottom: 20vh; transform: translateX(-50%);
    z-index: 10; width: max-content; max-width: 86vw;
    text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    font-size: 24px; font-weight: 300; letter-spacing: 4px;
    color: rgba(255,255,255,0.75); text-shadow: 0 2px 16px rgba(0,0,0,0.5);
    transition: opacity 0.6s ease;
  }
  .motivation.fade { opacity: 0; }

  /* 底部频谱 */
  .eq { position: fixed; left: 0; right: 0; bottom: 0; height: 110px; z-index: 5; pointer-events: none; }
  .eq canvas { width: 100%; height: 100%; display: block; }

  /* 反馈提示 */
  #feedback-tip {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    z-index: 99; padding: 14px 26px; border-radius: 12px;
    background: rgba(18,18,32,0.92); border: 1px solid rgba(255,255,255,0.15);
    color: #fff; font-size: 15px; letter-spacing: 1px;
    box-shadow: 0 12px 36px rgba(0,0,0,0.5);
    opacity: 0; transition: opacity 0.2s; pointer-events: none;
    max-width: 70vw; text-align: center;
  }

  @media (max-width: 900px) {
    .main-title { font-size: 52px; }
    .sub-title { font-size: 26px; }
    .cover { width: 220px; height: 220px; border-radius: 26px; }
    .controls { width: 220px; }
    .player { gap: 20px; }
    .lyric-line { font-size: 22px; }
    .lyric-line.current { font-size: 30px; }
    .lyrics { width: 36vw; }
    .motivation { font-size: 20px; }
  }
</style>
</head>
<body>

<div class="bg" id="bg"></div>

<!-- 顶部：在线播放搜索 -->
<div class="online-search">
  <span class="search-icon">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="7"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
  </span>
  <select id="search-source">
    <option value="netease">网易云</option>
    <option value="tencent">QQ音乐</option>
    <option value="kugou">酷狗</option>
  </select>
  <input type="text" id="search-input" placeholder="搜索歌曲，在线播放..." spellcheck="false">
  <span class="search-hint" id="search-hint">在线播放</span>
</div>

<!-- 左上：标题 -->
<div class="header">
  <div class="main-title" id="main-title">小风音乐</div>
  <div class="sub-title" id="sub-title">此刻聆听</div>
</div>

<!-- 左侧：播放控件 -->
<div class="player">
  <div class="cover" id="cover">
    <img id="cover-img" alt="">
    <svg class="cover-note" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 18V5l12-2v13"></path>
      <circle cx="6" cy="18" r="3"></circle>
      <circle cx="18" cy="16" r="3"></circle>
    </svg>
  </div>

  <div class="controls">
    <div class="progress" id="progress">
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
        <div class="progress-dot" id="progress-dot"></div>
      </div>
    </div>
    <div class="time-row">
      <span id="time-current">0:00</span>
      <span id="time-total">0:00</span>
    </div>

    <div class="btn-row">
      <button class="icon-btn secondary" id="btn-mode" title="播放模式：列表循环">
        <svg id="mode-repeat" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="17 1 21 5 17 9"></polyline>
          <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
          <polyline points="7 23 3 19 7 15"></polyline>
          <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
        </svg>
        <svg id="mode-shuffle" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="display:none">
          <polyline points="16 3 21 3 21 8"></polyline>
          <line x1="4" y1="20" x2="21" y2="3"></line>
          <polyline points="21 16 21 21 16 21"></polyline>
          <line x1="15" y1="15" x2="21" y2="21"></line>
          <line x1="4" y1="4" x2="9" y2="9"></line>
        </svg>
        <svg id="mode-repeat-one" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="display:none">
          <polyline points="17 1 21 5 17 9"></polyline>
          <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
          <polyline points="7 23 3 19 7 15"></polyline>
          <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
          <line x1="11" y1="10" x2="12" y2="14"></line>
          <line x1="9" y1="13" x2="13" y2="13"></line>
        </svg>
      </button>
      <button class="icon-btn secondary" id="btn-prev" title="上一曲">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="19 20 9 12 19 4 19 20" fill="currentColor" stroke="none"></polygon>
          <line x1="5" y1="4" x2="5" y2="20"></line>
        </svg>
      </button>
      <button class="icon-btn play" id="btn-play" title="播放/暂停">
        <svg id="icon-play" width="30" height="30" viewBox="0 0 24 24" fill="currentColor" stroke="none">
          <path d="M8 5v14l11-7z"></path>
        </svg>
        <svg id="icon-pause" width="30" height="30" viewBox="0 0 24 24" fill="currentColor" stroke="none" style="display:none">
          <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"></path>
        </svg>
      </button>
      <button class="icon-btn secondary" id="btn-next" title="下一曲">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="5 4 15 12 5 20 5 4" fill="currentColor" stroke="none"></polygon>
          <line x1="19" y1="4" x2="19" y2="20"></line>
        </svg>
      </button>
      <button class="icon-btn secondary" id="btn-more" title="更多选项">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="5" r="1.6" fill="currentColor" stroke="none"></circle>
          <circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"></circle>
          <circle cx="12" cy="19" r="1.6" fill="currentColor" stroke="none"></circle>
        </svg>
      </button>
    </div>
  </div>
</div>

<!-- 更多菜单 -->
<div class="more-menu" id="more-menu">
  <div class="menu-item" id="menu-local"><span>选择音乐文件夹</span></div>
  <div class="menu-item" id="menu-import">📥 <span>导入歌单</span></div>
  <div class="menu-item" id="menu-playlists">📃 <span>我的歌单</span></div>
  <div class="menu-item" id="menu-queue">🎵 <span>播放队列</span></div>
  <div class="menu-divider"></div>
  <div class="menu-item" id="menu-settings">⚙️ <span>设置</span></div>
</div>

<!-- 搜索面板 -->
<div class="panel" id="search-panel">
  <div class="panel-header">
    <span class="panel-title">在线搜索</span>
    <span class="panel-sub" id="search-status"></span>
    <button class="panel-close" data-close="search-panel">✕</button>
  </div>
  <div class="panel-body" id="search-results"></div>
  <div class="panel-footer">
    <span class="panel-sub">点击播放 · 或加入队列</span>
  </div>
</div>

<!-- 队列面板 -->
<div class="panel" id="queue-panel">
  <div class="panel-header">
    <span class="panel-title">播放队列</span>
    <span class="panel-sub" id="queue-count">0 首</span>
    <button class="panel-close" data-close="queue-panel">✕</button>
  </div>
  <div class="panel-body" id="queue-list"></div>
  <div class="panel-footer">
    <button class="set-btn" id="btn-clear-queue">清空队列</button>
  </div>
</div>

<!-- 歌单面板 -->
<div class="panel" id="playlists-panel">
  <div class="panel-header">
    <span class="panel-title">我的歌单</span>
    <span class="panel-sub" id="pl-count">0 个</span>
    <button class="panel-close" data-close="playlists-panel">✕</button>
  </div>
  <div class="panel-body" id="playlists-list"></div>
  <div class="panel-footer">
    <input type="text" class="import-input" id="new-pl-name" placeholder="新建歌单名称..." style="flex:1">
    <button class="set-btn" id="btn-new-playlist">新建</button>
  </div>
</div>

<!-- 设置面板 -->
<div class="panel" id="settings-panel">
  <div class="panel-header">
    <span class="panel-title">设置</span>
    <button class="panel-close" data-close="settings-panel">✕</button>
  </div>
  <div class="panel-body">
    <div class="set-group">
      <div class="set-title">外观</div>
      <div class="set-row">
        <label>主题</label>
        <select id="set-theme">
          <option value="aurora">极光 · 蓝紫</option>
          <option value="ocean">海洋 · 青蓝</option>
          <option value="sunset">日落 · 橙粉</option>
          <option value="forest">森林 · 青绿</option>
        </select>
      </div>
      <div class="set-row">
        <label>幻灯片间隔</label>
        <input type="range" id="set-slide-interval" min="3" max="30" step="1" value="8">
        <span class="set-val" id="slide-interval-val">8s</span>
      </div>
    </div>
    <div class="set-group">
      <div class="set-title">歌词</div>
      <div class="set-row">
        <label>字号</label>
        <input type="range" id="set-lyrics-size" min="18" max="44" step="1" value="36">
        <span class="set-val" id="lyrics-size-val">36px</span>
      </div>
      <div class="set-row">
        <label>扫光颜色</label>
        <input type="color" id="set-scan-color" value="#ffffff">
      </div>
      <div class="set-row">
        <label class="set-check"><input type="checkbox" id="set-show-trans"> 显示歌词翻译</label>
      </div>
      <div class="set-row">
        <label class="set-check"><input type="checkbox" id="set-show-scan" checked> 歌词扫光</label>
      </div>
    </div>
    <div class="set-group">
      <div class="set-title">幻灯片背景</div>
      <div class="set-row">
        <button class="set-btn" id="btn-pick-slide">选择图片文件夹</button>
        <input type="file" id="slide-folder" webkitdirectory multiple style="display:none">
        <span class="panel-sub" id="slide-count"></span>
      </div>
      <div class="set-row">
        <label class="set-check"><input type="checkbox" id="set-slide-on" checked> 启用幻灯片背景</label>
      </div>
      <div class="set-info">选中的图片会作为背景轮播（半透明氛围），未选时使用默认深色渐变</div>
    </div>
    <div class="set-group">
      <div class="set-title">底部励志句</div>
      <div class="set-row">
        <label class="set-check"><input type="checkbox" id="set-quote-on" checked> 显示励志句子</label>
      </div>
    </div>
    <div class="set-group">
      <div class="set-title">关于</div>
      <div class="set-row">
        <span class="panel-sub">小风音乐 · 网页版（HTML 单文件）<br>登录/每日推荐/桌面歌词需桌面版 Electron</span>
      </div>
    </div>
  </div>
  <div class="panel-footer">
    <span class="panel-sub" id="set-save-tip"></span>
    <button class="set-btn primary" id="btn-save-settings">保存设置</button>
  </div>
</div>

<!-- 右侧歌词 -->
<div class="lyrics" id="lyrics">
  <div class="lyric-line prev" id="lrc-prev"></div>
  <div class="lyric-line current" id="lrc-current">点击顶部搜索框，搜索歌曲在线播放</div>
  <div class="lyric-line next" id="lrc-next"></div>
</div>

<!-- 底部励志句 -->
<div class="motivation" id="motivation">把平凡的日子，过成滚烫的诗</div>

<!-- 底部频谱 -->
<div class="eq"><canvas id="eq-canvas"></canvas></div>

<!-- 隐藏文件输入：本地音乐文件夹 -->
<input type="file" id="folder-input" webkitdirectory multiple style="display:none">

<div id="feedback-tip"></div>

<script src="layout-preview-app.js"></script>
</body>
</html>
